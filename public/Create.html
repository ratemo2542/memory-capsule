<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Memory Capsule</title>

    <link rel="stylesheet" href="crafted.css">
</head>

<body>

    <div class="page">
        <header class="site-header">
            <a class="brand" href="index.html"><span class="brand-mark"></span>Memory Capsule</a>
            <span class="site-note">Stored only in this browser.</span>
        </header>
        <main class="stage">
        <section class="panel form-panel">
            <p class="kicker">New capsule</p>
            <h1>Leave a note worth returning to.</h1>
            <p class="description">A few details are all you need.</p>

            <form id="memoryForm" novalidate>

                <div class="field">
                    <label for="recipient">For</label>
                    <input type="text" id="recipient" placeholder="Who is this for?" required>
                    <p class="field-error" id="recipientError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="occasion">Occasion</label>
                    <select id="occasion" required>
                        <option value="">Choose an occasion</option>
                        <option value="Birthday">Birthday</option>
                        <option value="Mothers Day">Mother's Day</option>
                        <option value="Fathers Day">Father's Day</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="Just Because">Just Because</option>
                    </select>
                    <p class="field-error" id="occasionError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="message">Your note</label>
                    <textarea id="message" placeholder="Write your personal message..." rows="5" required></textarea>
                    <p class="field-error" id="messageError" aria-live="polite"></p>
                </div>

                <label class="upload">
                    Add photographs
                    <span>Optional — choose up to six images.</span>

                    <input
                        type="file"
                        id="photos"
                        accept="image/*"
                        multiple
                    >
                </label>
                <p class="file-note" id="photoNote">Up to 6 images. They stay only in this browser.</p>

                <p class="field-error" id="formError" aria-live="polite"></p>

                <button type="submit">
                    <span class="button-label">Save capsule</span>
                </button>

            </form>

        </section>
        </main>
    </div>

    <script src="create.js"></script>

</body>
</html>
