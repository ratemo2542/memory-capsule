<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Memory Capsule</title>

    <link rel="stylesheet" href="minimal.css">
</head>

<body>

    <main class="hero">

        <div class="capsule">

            <h1>Create Your Memory</h1>

            <p>
                Let's turn a special moment into something
                they can experience again.
            </p>

            <form id="memoryForm" novalidate>

                <input
                    type="text"
                    id="recipient"
                    placeholder="Who is this for?"
                    required
                >
                <p class="field-error" id="recipientError" aria-live="polite"></p>

                <select id="occasion" required>
                    <option value="">Choose an occasion</option>
                    <option value="Birthday">Birthday</option>
                    <option value="Mothers Day">Mother's Day</option>
                    <option value="Fathers Day">Father's Day</option>
                    <option value="Anniversary">Anniversary</option>
                    <option value="Just Because">Just Because</option>
                </select>
                <p class="field-error" id="occasionError" aria-live="polite"></p>

                <textarea
                    id="message"
                    placeholder="Write your personal message..."
                    rows="5"
                    required
                ></textarea>
                <p class="field-error" id="messageError" aria-live="polite"></p>

                <label class="upload">
                    📸 Add your memories

                    <input
                        type="file"
                        id="photos"
                        accept="image/*"
                        multiple
                    >
                </label>
                <p class="file-note" id="photoNote">Up to 6 images. They stay only in this browser.</p>

                <p class="field-error" id="formError" aria-live="polite"></p>

                <button type="submit">
                    <span class="button-label">Create Capsule 🚀</span>
                </button>

            </form>

        </div>

    </main>

    <script src="create.js"></script>

</body>
</html>
