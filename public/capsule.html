<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Memory Capsule</title>
  <link rel="stylesheet" href="minimal.css">
</head>
<body>
  <main class="hero">
    <section class="capsule capsule--memory" id="capsuleContent" hidden>
      <div class="capsule-icon" aria-hidden="true">🚀</div>
      <p class="eyebrow" id="occasionName"></p>
      <h1>For <span id="recipientName"></span></h1>
      <p class="memory-message" id="memoryMessage"></p>
      <div class="photo-gallery" id="photoGallery"></div>
      <div class="actions">
        <button type="button" data-create-another>Create another</button>
        <button type="button" class="button-secondary" id="clearCapsule">Clear this capsule</button>
      </div>
    </section>
    <section class="capsule" id="emptyState" hidden>
      <div class="capsule-icon" aria-hidden="true">✨</div>
      <h1>No capsule yet</h1>
      <p>Create one to see your message and photos here.</p>
      <button type="button" data-create-another>Create a Memory</button>
    </section>
  </main>
  <script src="capsule.js"></script>
</body>
</html>
